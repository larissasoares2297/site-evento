<!DOCTYPE html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - Saúde em Foco 2026</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
      <div class="topo">
        <div class="logo">

        <h1>Saúde em Foco 2026</h1>
          </div>

        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="palestras.html">Palestras</a></li>
                <li><a href="inscricao.html">Inscrição</a></li>
            </ul>
        </nav>
      </div>

    </header>

    <main>

        <section>

            <h2>Formulário de Inscrição</h2>

            <form>

                <label for="nome">Nome Completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    required>

              

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu email"
                    required>
                    
                <label for="telefone">Telefone</label>
                <input 
                     type="telefone"
                     id="telefone"
                     name="telefone"
                     placeholder="(00)00000-0000"
                     required>
                    
                <label for="profissao">Profissão</label>

<select id="profissao" name="profissao" aria-label="Profissão">

    <option>Estudante</option>
    <option>Técnico(a) de Enfermagem</option>
    <option>Enfermeiro(a)</option>
    <option>Médico(a)</option>
    <option>Outro</option>

</select>
    
                    
                    <label for="mensagem">
                        Deixe uma mensagem
                    </label>
    
                  
    
                    <textarea
                        id="mensagem"
                        name="mensagem"
                        rows="5"
                        cols="40"
                        placeholder="Escreva aqui...">
                    </textarea>
    
                    
    
                    <button type="submit">
                        Enviar Inscrição
                    </button>
    
                </form>
    
            </section>
    
        </main>
    
        <footer>
    
            <p>© 2026 Saúde em Foco - Todos os direitos reservados.</p>
    
        </footer>
    
    </body>
    
    </html>
