<!DOCTYPE html>
<html lang="pt-BR">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - Saúde em Foco 2026</title>
</head>
<body>

    <header>

        <h1>Saúde em Foco 2026</h1>

        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="palestras.html">Palestras</a></li>
                <li><a href="inscricao.html">Inscrição</a></li>
            </ul>
        </nav>

    </header>

    <main>

        <section>

            <h2>Formulário de Inscrição</h2>

            <form>

                <label for="nome">Nome Completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    required>

                <br><br>

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu email"
                    required>
                    <br><br>
                <label for="telefone">Telefone</label>
                <input 
                     type="telefone"
                     id="telefone"
                     name="telefone"
                     placeholder="(00)00000-0000"
                     required>
                     <br><br>
                <select id="profissao" name="profissao">
                    <select aria-label="profissao"></select>

                        <option>Estudante</option>
                        <option>Técnico (a) de Enfermagem</option>
                        <option>Enfermeiro(a)</option>
                        <option>Médico(a)</option>
                        <option>Outro</option>
    
                    </select>
    
                    <br><br>
                    <label for="mensagem">
                        Deixe uma mensagem
                    </label>
    
                    <br>
    
                    <textarea
                        id="mensagem"
                        name="mensagem"
                        rows="5"
                        cols="40"
                        placeholder="Escreva aqui...">
                    </textarea>
    
                    <br><br>
    
                    <button type="submit">
                        Enviar Inscrição
                    </button>
    
                </form>
    
            </section>
    
        </main>
    
        <footer>
    
            <p>© 2026 Saúde em Foco - Todos os direitos reservados.</p>
    
        </footer>
    
    </body>
    
    </html>
